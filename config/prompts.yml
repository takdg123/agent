# Prompt Configuration for TORRI System
# Maps prompt names to their file paths and settings

prompts:
  grb_expert:
    file: "grb_expert.txt"
    description: "GRB expert analysis prompt (uses AstroSage model)"
    enabled: true
    model: "astrosage:70b-q4_K_M"
    
  kilonova_expert:
    file: "kilonova_expert.txt"
    description: "Kilonova expert analysis prompt (uses AstroSage model)"
    enabled: true
    model: "astrosage:70b-q4_K_M"
    
  astrophysicist_synthesis:
    file: "astrophysicist_synthesis.txt"
    description: "Astrophysicist synthesis prompt (uses Qwen 32B)"
    enabled: true
    model: "qwen2.5:32b"
    
  language_expert:
    file: "language_expert.txt"
    description: "Bilingual Korean-English translation prompt (uses Qwen 32B)"
    enabled: true
    model: "qwen2.5:32b"
    
  critic:
    file: "critic.txt"
    description: "Critical review and quality assessment prompt (uses Qwen 32B)"
    enabled: true
    model: "qwen2.5:32b"
    
  writer:
    file: "writer.txt"
    description: "Professional science writing polish prompt (uses Qwen 32B)"
    enabled: true
    model: "qwen2.5:32b"
    
  report_fixer_en:
    file: "report_fixer_en.txt"
    description: "Report fixer English analysis prompt"
    enabled: true
    
  report_fixer_ko:
    file: "report_fixer_ko.txt"
    description: "Report fixer Korean summary prompt"
    enabled: true
    
  report_validator:
    file: "report_validator.txt"
    description: "Report quality validation prompt"
    enabled: true

# Global prompt settings
settings:
  default_encoding: "utf-8"
  fallback_to_default: true
  cache_prompts: true
